<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebAR Project</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="loading-screen" style="
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.75);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; font-family: sans-serif;
  ">
    <div style="font-size: 18px; margin-bottom: 12px">読み込み中...</div>
    <div style="width:200px;height:6px;background:rgba(255,255,255,0.2);border-radius:3px">
      <div id="loading-bar" style="height:100%;width:0%;background:white;border-radius:3px;transition:width 0.3s"></div>
    </div>
  </div>

  <a-scene id="ar-scene" embedded arjs="debugUIEnabled: false;">
    <a-light type="ambient" color="#ffffff" intensity="1.0"></a-light>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let modelPath  = '';
    let markerPath = '';

    const urlParams = new URLSearchParams(window.location.search);
    const targetId  = urlParams.get('id') || urlParams.get('model');

    if (!targetId) {
      console.error('Error: id パラメータが指定されていません');
      document.body.innerHTML = '<h1>Error: id parameter is required</h1>';
    } else {
      modelPath  = `./assets/${targetId}/model.glb`;
      markerPath = `./assets/${targetId}/pattern.patt`;
      console.log(`Model: ${modelPath}`);
      console.log(`Marker: ${markerPath}`);
    }

    const modelConfigs = [
      {
        position: { x: 0, y: 3, z: 0 },
        scale:    { x: 2, y: 2, z: 2 },
        rotation: { x: 0, y: 180, z: 0 }
      },
      {
        position: { x: 0, y: 2, z: 0 },
        scale:    { x: 1, y: 1, z: 1 },
        rotation: { x: 0, y: -90, z: 0 }
      }
    ];

    const subModelPath = `./assets/submodel/square_pot.glb`;
  </script>

  <script>
    // アニメーション
    // AFRAME.registerComponent('rotate-group', {
    //   schema: { speed: { type: 'number', default: 30 } },
    //   tick: function (time, timeDelta) {
    //     const delta = (this.data.speed * timeDelta) / 1000;
    //     this.el.object3D.rotation.y += THREE.MathUtils.degToRad(delta);
    //   }
    // });

    // マテリアル修正の共通関数
    function fixMaterials(modelEl) {
      modelEl.addEventListener('model-loaded', () => {
        console.log('model loaded, fixing materials...');
        const mesh = modelEl.getObject3D('mesh');
        if (!mesh) return;

        mesh.traverse((object) => {
          if (object.isMesh && object.material) {
            object.material.metalness = 0.0;
            object.material.roughness = 0.5;

            if (object.material.map) {
              object.material.map.colorSpace = THREE.SRGBColorSpace;
              object.material.map.needsUpdate = true;
            }

            object.material.flatShading = false;
            object.material.needsUpdate = true;

            if (object.geometry) {
              object.geometry.computeVertexNormals();
            }
          }
        });
        console.log('Materials fixed');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {

      const sceneEl = document.getElementById('ar-scene');

      // ローディングバーをタイマーで演出しつつ、2秒後に起動
      let progress = 0;
      const barInterval = setInterval(() => {
        progress += 5;
        document.getElementById('loading-bar').style.width = progress + '%';
        if (progress >= 100) clearInterval(barInterval);
      }, 100);

      setTimeout(() => {
        clearInterval(barInterval);
        document.getElementById('loading-bar').style.width = '100%';
        document.getElementById('loading-screen').style.display = 'none';
        setupMarker(sceneEl);
        console.log('setupMarker called');
      }, 2000);

      function setupMarker(sceneEl) {
        const markerEl = document.createElement('a-marker');
        markerEl.setAttribute('type', 'pattern');
        markerEl.setAttribute('url', markerPath);
        markerEl.setAttribute('emitevents', 'true');
        markerEl.setAttribute('smooth', 'true');
        markerEl.setAttribute('smoothCount', '5');
        markerEl.setAttribute('smoothTolerance', '0.01');
        markerEl.setAttribute('smoothThreshold', '2');

        const groupEl = document.createElement('a-entity');
        groupEl.setAttribute('id', 'flower-group');
        groupEl.setAttribute('visible', 'false');
        groupEl.setAttribute('rotate-group', 'speed: 30');

        // ★ パス直接指定（プリロードなし）
        const cfg0 = modelConfigs[0];
        const mainModelEl = document.createElement('a-entity');
        mainModelEl.setAttribute('gltf-model', modelPath);
        mainModelEl.setAttribute('position', `${cfg0.position.x} ${cfg0.position.y} ${cfg0.position.z}`);
        mainModelEl.setAttribute('scale',    `${cfg0.scale.x} ${cfg0.scale.y} ${cfg0.scale.z}`);
        mainModelEl.setAttribute('rotation', `${cfg0.rotation.x} ${cfg0.rotation.y} ${cfg0.rotation.z}`);
        fixMaterials(mainModelEl);
        groupEl.appendChild(mainModelEl);

        if (subModelPath) {
          const cfg1 = modelConfigs[1];
          const subModelEl = document.createElement('a-entity');
          subModelEl.setAttribute('gltf-model', subModelPath);
          subModelEl.setAttribute('position', `${cfg1.position.x} ${cfg1.position.y} ${cfg1.position.z}`);
          subModelEl.setAttribute('scale',    `${cfg1.scale.x} ${cfg1.scale.y} ${cfg1.scale.z}`);
          subModelEl.setAttribute('rotation', `${cfg1.rotation.x} ${cfg1.rotation.y} ${cfg1.rotation.z}`);
          fixMaterials(subModelEl);
          groupEl.appendChild(subModelEl);
        }

        markerEl.addEventListener('markerFound', () => {
          groupEl.setAttribute('visible', 'true');
          console.log('Marker found');
        });
        markerEl.addEventListener('markerLost', () => {
          groupEl.setAttribute('visible', 'false');
          console.log('Marker lost');
        });

        markerEl.appendChild(groupEl);
        sceneEl.appendChild(markerEl);
        console.log('setupMarker complete');
      }
    });
  </script>
</body>
</html>
